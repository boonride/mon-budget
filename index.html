<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MonBudget" />
  <title>MonBudget – Gestion Personnelle</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">💰</div>
      <h1 class="splash-title">Bienvenue</h1>
      <p class="splash-subtitle">C'est mieux qu'Excel</p>
      <div class="splash-loader"><div class="loader-bar"></div></div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-logo">💰</div>
      <h2 class="modal-title" id="auth-title">Connexion</h2>
      <div id="auth-error" class="auth-error hidden"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="vous@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="form-group hidden" id="pseudo-group">
        <label>Pseudo</label>
        <input type="text" id="auth-pseudo" placeholder="Votre prénom" />
      </div>
      <button class="btn-primary" id="auth-submit">Se connecter</button>
      <p class="auth-toggle">Pas de compte ? <span id="auth-switch">Créer un compte</span></p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <!-- Top Bar -->
    <header class="topbar">
      <button class="icon-btn" id="btn-auth-header" title="Compte">
        <span id="user-avatar" class="avatar">?</span>
      </button>
      <h1 class="app-name">MonBudget</h1>
      <button class="icon-btn" id="btn-settings" title="Paramètres">⚙️</button>
    </header>

    <!-- Pages -->
    <main class="pages">
      <div id="page-home" class="page active"></div>
      <div id="page-budget" class="page"></div>
      <div id="page-operations" class="page"></div>
      <div id="page-patrimoine" class="page"></div>
      <div id="page-epargne" class="page"></div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Accueil</span>
      </button>
      <button class="nav-btn" data-page="budget">
        <span class="nav-icon">💰</span>
        <span class="nav-label">Budget</span>
      </button>
      <button class="nav-btn nav-btn-fab" data-action="add-operation">
        <span class="nav-icon fab-icon">＋</span>
      </button>
      <button class="nav-btn" data-page="operations">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Opérations</span>
      </button>
      <button class="nav-btn" data-page="epargne">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Épargne</span>
      </button>
    </nav>
  </div>

  <!-- Settings Panel -->
  <div id="settings-panel" class="side-panel hidden">
    <div class="panel-overlay"></div>
    <div class="panel-content">
      <div class="panel-header">
        <h2>Paramètres</h2>
        <button class="close-btn" id="close-settings">✕</button>
      </div>
      <div class="panel-body">
        <section class="settings-section">
          <h3>Profil</h3>
          <div class="profile-pic-wrap">
            <div class="profile-pic" id="profile-pic-preview">👤</div>
            <button class="btn-ghost" id="change-photo">Changer la photo</button>
            <input type="file" id="photo-input" accept="image/*" class="hidden" />
          </div>
          <div class="form-group">
            <label>Pseudo</label>
            <input type="text" id="settings-pseudo" placeholder="Votre prénom" />
          </div>
          <button class="btn-primary" id="save-profile">Enregistrer</button>
        </section>
        <section class="settings-section">
          <h3>Catégories</h3>
          <div id="categories-list" class="categories-list"></div>
          <button class="btn-ghost add-cat-btn" id="add-category">+ Ajouter une catégorie</button>
        </section>
        <section class="settings-section">
          <button class="btn-danger" id="btn-logout">Se déconnecter</button>
        </section>
      </div>
    </div>
  </div>

  <!-- Add/Edit Operation Modal -->
  <div id="operation-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="op-modal-title">Nouvelle opération</h2>
        <button class="close-btn" id="close-op-modal">✕</button>
      </div>
      <div class="type-toggle">
        <button class="type-btn active" data-type="depense">Dépense</button>
        <button class="type-btn" data-type="revenu">Revenu</button>
      </div>
      <div class="form-group">
        <label>Montant (€)</label>
        <input type="number" id="op-amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal" />
      </div>
      <div class="form-group">
        <label>Description</label>
        <input type="text" id="op-description" placeholder="Ex: Courses Carrefour" />
      </div>
      <div class="form-group">
        <label>Catégorie</label>
        <select id="op-category"></select>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="op-date" />
      </div>
      <button class="btn-primary" id="save-operation">Enregistrer</button>
    </div>
  </div>

  <!-- Add/Edit Category Modal -->
  <div id="category-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="cat-modal-title">Nouvelle catégorie</h2>
        <button class="close-btn" id="close-cat-modal">✕</button>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="cat-name" placeholder="Ex: Voyages" />
      </div>
      <div class="form-group">
        <label>Icône</label>
        <div class="icon-picker" id="icon-picker"></div>
        <input type="text" id="cat-icon-custom" placeholder="Ou collez un emoji personnalisé" />
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="cat-type">
          <option value="depense">Dépense</option>
          <option value="revenu">Revenu</option>
          <option value="both">Les deux</option>
        </select>
      </div>
      <button class="btn-primary" id="save-category">Enregistrer</button>
    </div>
  </div>

  <!-- Add Saving Goal Modal -->
  <div id="goal-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="goal-modal-title">Nouvel objectif</h2>
        <button class="close-btn" id="close-goal-modal">✕</button>
      </div>
      <div class="form-group">
        <label>Nom de l'objectif</label>
        <input type="text" id="goal-name" placeholder="Ex: Vacances été" />
      </div>
      <div class="form-group">
        <label>Icône</label>
        <div class="icon-picker" id="goal-icon-picker"></div>
      </div>
      <div class="form-group">
        <label>Cible (€)</label>
        <input type="number" id="goal-target" placeholder="5000" min="0" />
      </div>
      <div class="form-group">
        <label>Montant atteint (€)</label>
        <input type="number" id="goal-current" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Échéance</label>
        <input type="month" id="goal-deadline" />
      </div>
      <button class="btn-primary" id="save-goal">Enregistrer</button>
    </div>
  </div>

  <!-- Patrimoine Asset Modal -->
  <div id="asset-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="asset-modal-title">Nouvel actif</h2>
        <button class="close-btn" id="close-asset-modal">✕</button>
      </div>
      <div class="type-toggle">
        <button class="type-btn active" data-type="actif">Actif</button>
        <button class="type-btn" data-type="passif">Passif</button>
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="asset-name" placeholder="Ex: Résidence principale" />
      </div>
      <div class="form-group">
        <label>Icône</label>
        <div class="icon-picker" id="asset-icon-picker"></div>
      </div>
      <div class="form-group actif-only">
        <label>Valeur actuelle (€)</label>
        <input type="number" id="asset-value" placeholder="0" min="0" />
      </div>
      <div class="form-group passif-only hidden">
        <label>Capital restant dû (€)</label>
        <input type="number" id="asset-debt" placeholder="0" min="0" />
      </div>
      <div class="form-group passif-only hidden">
        <label>Mensualité (€)</label>
        <input type="number" id="asset-monthly" placeholder="0" min="0" />
      </div>
      <div class="form-group passif-only hidden">
        <label>Taux (%)</label>
        <input type="number" id="asset-rate" placeholder="0" step="0.01" min="0" />
      </div>
      <button class="btn-primary" id="save-asset">Enregistrer</button>
    </div>
  </div>

  <!-- Placement Modal -->
  <div id="placement-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="placement-modal-title">Nouveau placement</h2>
        <button class="close-btn" id="close-placement-modal">✕</button>
      </div>
      <div class="form-group">
        <label>Nom du placement</label>
        <input type="text" id="placement-name" placeholder="Ex: Livret A" />
      </div>
      <div class="form-group">
        <label>Icône</label>
        <div class="icon-picker" id="placement-icon-picker"></div>
      </div>
      <div class="form-group">
        <label>Capital investi (€)</label>
        <input type="number" id="placement-invested" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Valeur actuelle (€)</label>
        <input type="number" id="placement-current" placeholder="0" min="0" />
      </div>
      <div class="form-group">
        <label>Taux annuel (%)</label>
        <input type="number" id="placement-rate" placeholder="0" step="0.01" min="0" />
      </div>
      <div class="form-group">
        <label>Liquidité</label>
        <select id="placement-liquidity">
          <option>Immédiate</option>
          <option>Court terme</option>
          <option>1-2 mois</option>
          <option>Long terme</option>
          <option>Retraite</option>
        </select>
      </div>
      <button class="btn-primary" id="save-placement">Enregistrer</button>
    </div>
  </div>

  <!-- Budget Config Modal -->
  <div id="budget-config-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-card">
      <div class="modal-header">
        <h2>Budget planifié</h2>
        <button class="close-btn" id="close-budget-modal">✕</button>
      </div>
      <div class="form-group">
        <label id="budget-cat-label">Catégorie</label>
        <input type="number" id="budget-amount" placeholder="Montant (€)" min="0" />
      </div>
      <button class="btn-primary" id="save-budget-config">Enregistrer</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/operations.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/patrimoine.js"></script>
  <script src="js/epargne.js"></script>
  <script src="js/home.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
